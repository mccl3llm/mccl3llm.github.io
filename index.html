<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Wiktionary App</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        #loading {
            display: none;
            text-align: center;
            padding: 20px;
            font-size: 18px;
        }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
        /* Ensure input fields have a font size greater than 16px */
        input, textarea, select {
            font-size: 16px; /* Set font size to 16px or larger */
        }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>
    <iframe id="wiktionaryFrame" src="https://en.wiktionary.org" title="Wiktionary"></iframe>
    <script>
        const frame = document.getElementById('wiktionaryFrame');
        const loading = document.getElementById('loading');

        // Show loading indicator when the iframe is loading
        frame.onload = () => {
            loading.style.display = 'none'; // Hide loading indicator when the frame loads
        };
        loading.style.display = 'block'; // Show loading indicator
    </script>
</body>
</html>
